# The deploy scripts' inputs: one table per chain id (docs/CONVENTIONS.md §10). Each script reads the table of the chain
# it runs on, and refuses a chain that has none. Addresses only: no key, and no RPC URL, is ever committed.
#
# Fields:
#   name                    what the chain is, for the logs
#   deployer                the account that sends every script's transactions; the wallet passed to `forge script`
#                           (--account, --private-key) must be this account
#   admin                   DEFAULT_ADMIN_ROLE: grants roles, creates markets, withdraws (the timelock on mainnet)
#   admin_transfer_delay    the two-step admin transfer's delay, in seconds (2 days on mainnet)
#   upgrader                UPGRADER_ROLE: the only key that can upgrade (the timelock on mainnet)
#   operator                OPERATOR_ROLE: settings, pause, halt, breaker reset (the admin Safe on mainnet)
#   guardian                GUARDIAN_ROLE: halt, pause, revoke a relayer key; it can only take power away
#   openers, settlers       the backend's relayer accounts: at least two of each, so one revoked key can't stop
#                           trading (ARCHITECTURE §4.2, re-evaluation F12)
#   token                   USDG's address; the zero address means the chain has none, and the scripts use the mock
#                           that DeployMockUsdg.s.sol recorded in deployments/<chainId>.json
#   pool_floor              free money below which no loser fee is taken and nothing can be withdrawn (≥ 500 tokens)
#   fee_recipient           receives swept fees and seed recovery
#   rewards_recipient       receives rewards withdrawals
#   refund_delay_secs       the safety refund: a bet still open this long after its expiry returns its stake (0 = off)
#   breaker_max_net_profit  the circuit breaker: net profit allowed out per window, in base units (0 = off)
#   breaker_window_secs     the circuit breaker's window
#   leverages               BTC's markets, by leverage; each is created switched off, with the settings
#                           script/config/MarketSettings.sol holds for it
#   enabled                 the leverages Configure.s.sol then switches on
#   pool_funding            the pool's total Configure.s.sol funds up to (the floor included), in base units
#
# Amounts are in base units: USDG has 6 decimals, so $1 is 1_000_000.

# Local anvil (and `forge test`, whose chain id is also 31337). The accounts are anvil's well-known test accounts
# 0 to 4, whose keys every Foundry install prints: never use them on a real chain.
